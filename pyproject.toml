[project]
name = "tag"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pygame-ce>=2.5.8",
]

[project.scripts]
tag = "tag:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 150
